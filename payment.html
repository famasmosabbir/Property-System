
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Property Ecosystem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Property System</h2>
        <p>Management Portal</p>

        <a href="dashboard.html">Dashboard</a>
        <a href="property.html">Properties</a>
        <a href="tenant.html">Tenants</a>
        <a href="lease.html">Leases</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="payment.html" class="active">Payments</a>
        <a href="index.html">Logout</a>
    </div>

    <div class="main-content">
        <h1>Payment Management</h1>
        <p>Record rental payments and track payment status.</p>

        <div class="form-container">
            <h2 id="formTitle">Record New Payment</h2>

            <form id="paymentForm">
                <input type="hidden" id="editPaymentIndex">

                <label for="paymentTenant">Tenant Name</label>
                <input
                    type="text"
                    id="paymentTenant"
                    placeholder="Enter tenant name"
                    required
                >

                <label for="paymentProperty">Property Name</label>
                <input
                    type="text"
                    id="paymentProperty"
                    placeholder="Enter property name"
                    required
                >

                <label for="paymentAmount">Payment Amount (৳)</label>
                <input
                    type="number"
                    id="paymentAmount"
                    min="0"
                    step="0.01"
                    placeholder="Enter payment amount"
                    required
                >

                <label for="paymentDate">Payment Date</label>
                <input type="date" id="paymentDate" required>

                <label for="paymentStatus">Payment Status</label>
                <select id="paymentStatus" required>
                    <option value="">Select Payment Status</option>
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                    <option value="Overdue">Overdue</option>
                </select>

                <button type="submit" id="paymentSubmit">
                    Add Payment
                </button>

                <button
                    type="button"
                    id="cancelEdit"
                    onclick="clearPaymentForm()"
                    hidden
                >
                    Cancel Edit
                </button>
            </form>
        </div>

        <div class="table-container">
            <h2>Payment Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Tenant</th>
                        <th>Property</th>
                        <th>Amount</th>
                        <th>Payment Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="paymentTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="payment.js"></script>
</body>
</html>
